set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
set -g default-command /bin/zsh
set -g status-style "fg=#F0C674,bg=#282A2E"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

